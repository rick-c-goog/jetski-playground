apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-sglang-w1
  namespace: ubench-llmd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dynamo-sglang-worker
      replica: w1
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "32"
        gke-gcsfuse/ephemeral-storage-limit: 600Gi
        gke-gcsfuse/memory-limit: 64Gi
        gke-gcsfuse/volumes: "true"
      labels:
        app: dynamo-sglang-worker
        replica: w1
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-ikwak-reliabilit-a4-highgpu-8g-a4-0256e2f1-34t3
      serviceAccountName: workload-identity-k8s-sa
      tolerations:
      - operator: Exists
      containers:
      - name: sglang
        image: lmsysorg/sglang:nightly-dev-cu13-20260922-582389ce@sha256:0e1b14e302619a42ef5581b87db6804651d4f946301cf543d74a3a1eb1c33b40
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK", "SYS_RESOURCE"]
        command: ["/bin/bash", "-c"]
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "4,5,6,7"
        - name: NCCL_NET_PLUGIN
          value: "none"
        - name: NCCL_TUNER_PLUGIN
          value: "none"
        - name: NCCL_PROFILER_PLUGIN
          value: "none"
        - name: SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE
          value: "1"
        - name: SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT
          value: "per_rank"
        - name: SGLANG_SIMULATE_ACC_LEN
          value: "3.51"
        - name: SGLANG_SIMULATE_ACC_METHOD
          value: "match-expected"
        - name: SGLANG_SIMULATE_ACC_TOKEN_MODE
          value: "real-draft-token"
        - name: MOONCAKE_PROTOCOL
          value: "rdma"
        - name: MOONCAKE_DEVICE
          value: "mlx5_4,mlx5_5,mlx5_6,mlx5_7"
        - name: MOONCAKE_MASTER
          value: "dynamo-sglang-w1.ubench-llmd.svc.cluster.local:50051"
        - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
          value: "68719476736"
        - name: MOONCAKE_LOCAL_BUFFER_SIZE
          value: "4294967296"
        - name: MOONCAKE_METADATA_SERVER
          value: "P2PHANDSHAKE"
        - name: MOONCAKE_ENABLE_SSD_OFFLOAD
          value: "1"
        - name: MOONCAKE_OFFLOAD_FILE_STORAGE_PATH
          value: "/mnt/lustre_1000mbps/mooncake_sglang_kv_cache"
        - name: UCX_NET_DEVICES
          value: "all"
        args:
        - |
          set -euo pipefail
          ulimit -l unlimited || true
          export PYTHONNOUSERSITE=1
          export PYTHONUNBUFFERED=1
          export SGLANG_TIMEOUT_KEEP_ALIVE=900
          mkdir -p /mnt/lustre_1000mbps/mooncake_sglang_kv_cache
          nohup mooncake_master -rpc_port=50051 -rpc_thread_num=8 -default_kv_lease_ttl=30000 -eviction_high_watermark_ratio=0.95 -eviction_ratio=0.1 -enable_offload=true -enable_disk_eviction=true -root_fs_dir=/mnt/lustre_1000mbps/mooncake_sglang_kv_cache -logtostderr > /tmp/mooncake_master.log 2>&1 < /dev/null &
          sleep 1
          nohup MOONCAKE_OFFLOAD_FILE_STORAGE_PATH=/mnt/lustre_1000mbps/mooncake_sglang_kv_cache mooncake_client -host=127.0.0.1 -port=50052 -global_segment_size='64GB' -local_buffer_size='4GB' -metadata_server='P2PHANDSHAKE' -master_server_address='dynamo-sglang-w1.ubench-llmd.svc.cluster.local:50051' -protocol='rdma' -device_names='mlx5_4,mlx5_5,mlx5_6,mlx5_7' -enable_offload=true -start_offload_rpc_server=true -logtostderr > /tmp/mooncake_client.log 2>&1 < /dev/null &
          if [ -d /mnt/lustre_1000mbps/sglang_kernel_cache/w1/sglang ]; then
            echo "Restoring pre-compiled SGLang FlashInfer/Triton/CuteDSL kernels from Lustre..."
            mkdir -p /root/.cache
            cp -rn /mnt/lustre_1000mbps/sglang_kernel_cache/w1/sglang /root/.cache/ || true
          fi
          EXTRA_ARGS=$(python3 - << 'PYEOF'
          from sglang.srt.server_args import prepare_server_args
          base = [
              "--trust-remote-code",
              "--model-path", "/gcs/deepseek-ai/DeepSeek-V4.1-Flash",
              "--served-model-name", "deepseek-ai/DeepSeek-V4.1-Flash",
              "--tp", "4",
              "--ep-size", "4",
              "--max-running-requests", "256",
              "--mem-fraction-static", "0.85",
              "--speculative-algorithm", "DSPARK",
              "--speculative-dspark-block-size", "5",
              "--cuda-graph-max-bs-decode", "64",
              "--chunked-prefill-size", "32768",
              "--swa-prefix-tails", "2048",
              "--prefill-decode-interval", "64",
              "--enable-hierarchical-cache",
              "--hicache-ratio", "1.2",
              "--hicache-size", "0",
              "--hicache-mem-layout", "page_first_direct",
              "--hicache-io-backend", "direct",
              "--hicache-write-policy", "write_through",
              "--hicache-storage-backend", "mooncake",
              "--hicache-storage-prefetch-policy", "wait_complete",
          ]
          chosen = []
          for cand in [
              ["--tokenizer-worker-num", "8"],
              ["--dp-size", "4", "--enable-dp-attention", "--enable-dp-lm-head", "--load-balance-method", "total_requests"],
              ["--enable-dp-attention-local-control-broadcast"],
          ]:
              try:
                  prepare_server_args(base + chosen + cand)
                  chosen.extend(cand)
              except Exception:
                  pass
          print(" ".join(chosen))
          PYEOF
          )
          echo "Starting Upgraded Upstream Recipe SGLang Worker w1 (TP=4, EP=4, extra=[$EXTRA_ARGS], mode=stage5_mooncake_lustre, RDMA enabled)..."
          exec sglang serve \
            --trust-remote-code \
            --model-path /gcs/deepseek-ai/DeepSeek-V4.1-Flash \
            --served-model-name deepseek-ai/DeepSeek-V4.1-Flash \
            --tp 4 \
            --ep-size 4 \
            --max-running-requests 256 \
            --host 0.0.0.0 \
            --port 8888 \
            --mem-fraction-static 0.85 \
            --speculative-algorithm DSPARK \
            --speculative-dspark-block-size 5 \
            --cuda-graph-max-bs-decode 64 \
            --chunked-prefill-size 32768 \
            --swa-prefix-tails 2048 \
            --prefill-decode-interval 64 \
            $EXTRA_ARGS \
            --enable-metrics \
            --enable-cache-report \
            --watchdog-timeout 3600 \
            --enable-hierarchical-cache \
            --hicache-ratio 1.2 \
            --hicache-size 0 \
            --hicache-mem-layout page_first_direct \
            --hicache-io-backend direct \
            --hicache-write-policy write_through \
            --hicache-storage-backend mooncake \
            --hicache-storage-prefetch-policy wait_complete
        ports:
        - containerPort: 8888
          name: http
        - containerPort: 50051
          name: mooncake-rpc
        resources:
          limits:
            nvidia.com/gpu: "4"
          requests:
            cpu: "64"
            memory: 700Gi
            nvidia.com/gpu: "4"
        volumeMounts:
        - mountPath: /gcs
          name: gcs-model
          readOnly: true
        - mountPath: /mnt/lustre_1000mbps
          name: lustre-tier
        - mountPath: /dev/infiniband
          name: dev-infiniband
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - name: gcs-model
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: ikwak-eu-stuff
            mountOptions: implicit-dirs,max-conns-per-host=0,file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,file-cache:max-parallel-downloads:32,file-cache:download-chunk-size-mb:64
      - name: lustre-tier
        persistentVolumeClaim:
          claimName: lustre-1000mbps-pvc
      - name: dev-infiniband
        hostPath:
          path: /dev/infiniband
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-sglang-w1
  namespace: ubench-llmd
spec:
  selector:
    app: dynamo-sglang-worker
    replica: w1
  ports:
  - name: http
    port: 8888
    targetPort: 8888
  - name: mooncake-rpc
    port: 50051
    targetPort: 50051
---
